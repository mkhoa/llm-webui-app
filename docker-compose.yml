services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - 8090:8090
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - REDIS_URL=redis://redis:6379
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - OPENAI_API_BASE_URL=http://hermes:8642/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
    volumes:
      - ./data/open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - postgres
      - redis
      - hermes

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./app/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - mcp-network

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      timeout: 3s
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - mcp-network

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    command: --config /app/config.yaml
    ports:
      - 4000:4000
    environment:
      - GOOGLE_KEY=${GOOGLE_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      - STORE_MODEL_IN_DB=True
    volumes:
      - ./app/litellm/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - postgres

  hermes:
    build: ./app/hermes
    container_name: hermes
    ports:
      - 8642:8642
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${LITELLM_MASTER_KEY}
      - API_SERVER_MODEL_NAME=hermes
      - HERMES_MODEL=gemini-flash-latest
      - HERMES_PROVIDER=custom
      - HERMES_BASE_URL=http://litellm:4000/v1
      - HERMES_API_KEY=${LITELLM_MASTER_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - DATABRICKS_CATALOG=${DATABRICKS_CATALOG}
      - DATABRICKS_HOST=${DATABRICKS_HOST}
      - DATABRICKS_HTTP_PATH=${DATABRICKS_HTTP_PATH}
      - DATABRICKS_SCHEMA=${DATABRICKS_SCHEMA}
      - DATABRICKS_THREADS=${DATABRICKS_THREADS}
      - DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
      - DATABRICKS_TYPE=${DATABRICKS_TYPE}
      - ERP_URL=${ERP_URL}
      - ERP_API_KEY=${ERP_API_KEY}
      - ERP_API_SECRET=${ERP_API_SECRET}
      - OBSIDIAN_VAULT_PATH=/opt/repo/mkhoa-obsidian-vault
    volumes:
      - ./data/hermes:/opt/data
      - ./data/repo:/opt/repo
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - litellm

  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    command: dashboard --host 0.0.0.0 --insecure
    ports:
      - 9119:9119
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - GATEWAY_HEALTH_URL=http://hermes:8642
    volumes:
      - ./data/hermes:/opt/data
    depends_on:
      - hermes
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
