services:
  # ----- reverse proxy + automatic Let's Encrypt SSL -----
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.7
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DEFAULT_HOST=chat.minhtran.vn
    volumes:
      - ./data/nginx/conf.d:/etc/nginx/conf.d
      - ./data/nginx/vhost.d:/etc/nginx/vhost.d
      - ./data/nginx/html:/usr/share/nginx/html
      - ./data/nginx/certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped
    networks:
      - mcp-network

  acme-companion:
    image: nginxproxy/acme-companion:2.5
    container_name: acme-companion
    environment:
      - DEFAULT_EMAIL=admin@minhtran.vn
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - ./data/nginx/conf.d:/etc/nginx/conf.d
      - ./data/nginx/vhost.d:/etc/nginx/vhost.d
      - ./data/nginx/html:/usr/share/nginx/html
      - ./data/nginx/certs:/etc/nginx/certs
      - ./data/nginx/acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    restart: unless-stopped
    networks:
      - mcp-network

  # ----- chat UI (Google SSO, restricted to minhtran.vn) -----
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    expose:
      - "8090"
    env_file:
      - .env
    environment:
      # routing + TLS via nginx-proxy / acme-companion
      - VIRTUAL_HOST=chat.minhtran.vn
      - VIRTUAL_PORT=8090
      - LETSENCRYPT_HOST=chat.minhtran.vn
      - LETSENCRYPT_EMAIL=admin@minhtran.vn
      - WEBUI_URL=https://chat.minhtran.vn
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # data
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - REDIS_URL=redis://redis:6379
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      # model backend: hermes is gone — point straight at litellm
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # auth: Google SSO only, restricted to the minhtran.vn workspace
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENID_PROVIDER_URL=https://accounts.google.com/.well-known/openid-configuration
      - GOOGLE_OAUTH_AUTHORIZE_PARAMS={"hd":"minhtran.vn"}
    volumes:
      - ./data/open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - postgres
      - redis
      - litellm

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./app/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - mcp-network

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      timeout: 3s
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - mcp-network

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    command: --config /app/config.yaml
    expose:
      - "4000"
    environment:
      - GOOGLE_KEY=${GOOGLE_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      - STORE_MODEL_IN_DB=True
    volumes:
      - ./app/litellm/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - postgres

  # ----- two isolated OpenClaw agents -----
  openclaw-manager:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-manager
    environment:
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_SANDBOX=1
      - OPENCLAW_SKIP_ONBOARDING=1
    ports:
      - "18789:18789"
    volumes:
      - ./data/openclaw-manager:/home/node/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - mcp-network

  openclaw-staff:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-staff
    environment:
      - OPENCLAW_GATEWAY_PORT=18889
      - OPENCLAW_SANDBOX=1
    ports:
      - "18889:18889"
    volumes:
      - ./data/openclaw-staff:/home/node/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
