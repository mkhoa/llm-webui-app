services:
  # ----- chat UI (Google SSO, restricted to minhtran.vn) -----
  # TLS terminates at the host's nginx (see /etc/nginx/sites-available/chat.minhtran.vn);
  # this service is only reachable on the loopback interface.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    environment:
      - WEBUI_URL=https://chat.minhtran.vn
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # data
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - REDIS_URL=redis://redis:6379
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - OPENAI_API_BASE_URL=http://genie:8642/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # auth: Google SSO only, restricted to the minhtran.vn workspace
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENID_PROVIDER_URL=https://accounts.google.com/.well-known/openid-configuration
      - GOOGLE_OAUTH_AUTHORIZE_PARAMS={"hd":"minhtran.vn"}
    volumes:
      - ./data/open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - postgres
      - redis
      - genie

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./app/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - mcp-network

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      timeout: 3s
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - mcp-network

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    command: --config /app/config.yaml
    expose:
      - "4000"
    environment:
      - GOOGLE_KEY=${GOOGLE_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      - STORE_MODEL_IN_DB=True
    volumes:
      - ./app/litellm/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - postgres

  genie:
    build: ./app/genie
    container_name: genie
    ports:
      - 8642:8642
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${LITELLM_MASTER_KEY}
      - API_SERVER_MODEL_NAME=genie
      - HERMES_MODEL=gemini-flash-latest
      - HERMES_PROVIDER=custom
      - HERMES_BASE_URL=http://litellm:4000/v1
      - HERMES_API_KEY=${LITELLM_MASTER_KEY}
      - DATABRICKS_CATALOG=${DATABRICKS_CATALOG}
      - DATABRICKS_HOST=${DATABRICKS_HOST}
      - DATABRICKS_HTTP_PATH=${DATABRICKS_HTTP_PATH}
      - DATABRICKS_SCHEMA=${DATABRICKS_SCHEMA}
      - DATABRICKS_THREADS=${DATABRICKS_THREADS}
      - DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
      - DATABRICKS_TYPE=${DATABRICKS_TYPE}
      - ERP_URL=${ERP_URL}
      - ERP_API_KEY=${ERP_API_KEY}
      - ERP_API_SECRET=${ERP_API_SECRET}
      - OBSIDIAN_VAULT_PATH=/opt/repo/mkhoa-obsidian-vault
    volumes:
      - ./data/genie:/opt/data
      - ./data/repo:/opt/repo
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - litellm

  genie-dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: genie-dashboard
    command: dashboard --host 0.0.0.0 --insecure
    ports:
      - 9119:9119
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - GATEWAY_HEALTH_URL=http://genie:8642
    volumes:
      - ./data/genie:/opt/data
    depends_on:
      - genie
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
